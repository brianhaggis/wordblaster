services:
  - type: web
    name: wordblaster
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker: game state lives in memory. Threads handle the live connections.
    startCommand: gunicorn -w 1 --threads 100 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
